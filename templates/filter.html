<!-- filter post form -->
    <form method="get" action="" id="filterform">
        <h2>Filter</h2>
        <div id="filter-range">
            <h3>Data range</h3>
            <div id="filter-content">
                {% csrf_token %}
                <label for="startdate">Start</label>
                <input type="date" name="startdate" value="{{startdate}}">
                {% csrf_token %}
                <label for="enddate">End</label>
                <input type="date" name="enddate" value="{{enddate}}">
            </div>
            <h3>Select Victim Type</h3>
            <div id="receiver-content">
                {% csrf_token %}
                <div id="receiver-type-content">
                    {% for receivercat in receivercatlist %}
                        {% if receivercat in selectedreceivercats %}
                            <input type="checkbox" name="receivertype" value="{{receivercat}}" checked>
                                {{receivercat}}</input>
                        {% else %}
                            <input type="checkbox" name="receivertype" value="{{receivercat}}">
                                {{receivercat}}</input>
                        {% endif %}
                    {% endfor %}
                </div>
            </div>
        </div>
        <button type="submit">Filter</button>
    </form>
